[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "hypergeometric"
version = "0.1.0"
description = "Statistical certification and porting of agent configurations across models, without an eval suite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Akshay Reddy" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/internet-zero/hypergeometric-ai"

[project.optional-dependencies]
live = ["openai>=1.50"]

[project.scripts]
hypergeometric = "hypergeometric.cli:main"

[tool.poetry]
packages = [{ include = "hypergeometric" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
black = ">=24.0"
isort = ">=5.13"
ruff = ">=0.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-grid tests under tests/agent/ are integration-style (require
# OPENAI_API_KEY, access to the models under test, and the gitignored
# local/ config bundle) and never run in CI. They're kept for local/manual
# use; CI skips them. Run with: poetry run pytest tests/agent/ -s after
# exporting the required env vars.
addopts = "--ignore=tests/agent"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SVG template lines in the asset generator cannot fit the line limit
"scripts/*" = ["E501"]
